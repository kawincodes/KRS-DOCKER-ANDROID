name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build APKs
        run: ./gradlew :app:assembleRelease :app:assembleDebug --no-daemon

      - name: Prepare signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > keystore.jks
            echo "KS_PASS=${{ secrets.KEYSTORE_PASSWORD }}" >> "$GITHUB_ENV"
            echo "KS_ALIAS=${{ secrets.KEY_ALIAS }}" >> "$GITHUB_ENV"
            echo "KEY_PASS=${{ secrets.KEY_PASSWORD }}" >> "$GITHUB_ENV"
            echo "Using release keystore from secrets"
          else
            keytool -genkeypair -keystore keystore.jks -storepass krsdockers -keypass krsdockers -alias krs \
              -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=KRS Dockers, O=KRS Tech Solutions, C=IN"
            echo "KS_PASS=krsdockers" >> "$GITHUB_ENV"
            echo "KS_ALIAS=krs" >> "$GITHUB_ENV"
            echo "KEY_PASS=krsdockers" >> "$GITHUB_ENV"
            echo "::warning::No KEYSTORE_BASE64 secret; signed with a throwaway key (users must uninstall before upgrading)."
          fi

      - name: Sign release APK
        run: |
          BT="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)"
          VERSION="${GITHUB_REF_NAME#v}"
          [ "$GITHUB_REF_TYPE" = "tag" ] || VERSION="$(git rev-parse --short HEAD)"
          mkdir -p dist
          "$BT/zipalign" -f -p 4 app/build/outputs/apk/release/app-release-unsigned.apk dist/aligned.apk
          "$BT/apksigner" sign --ks keystore.jks --ks-pass "pass:$KS_PASS" --ks-key-alias "$KS_ALIAS" --key-pass "pass:$KEY_PASS" \
            --out "dist/krs-dockers-v${VERSION}.apk" dist/aligned.apk
          "$BT/apksigner" verify "dist/krs-dockers-v${VERSION}.apk"
          cp app/build/outputs/apk/debug/app-debug.apk "dist/krs-dockers-v${VERSION}-debug.apk"
          rm dist/aligned.apk
          sha256sum dist/*.apk > dist/SHA256SUMS.txt
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: krs-dockers-${{ env.VERSION }}
          path: dist/*

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: KRS Dockers ${{ github.ref_name }}
          body_path: RELEASE_NOTES.md
          files: |
            dist/*.apk
            dist/SHA256SUMS.txt
