name: Release

on:
  push:
    tags: ["v*"]
    branches: ["**"]
    paths: ["VERSION"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release (creates tag v<version>), e.g. 1.0.0"
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Install Android SDK packages
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses > /dev/null 2>&1 || true
          "$SDKM" --install "platforms;android-35" "build-tools;35.0.0" "platform-tools" > /dev/null

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Cache native downloads
        uses: actions/cache@v4
        with:
          path: .native-cache
          key: native-${{ hashFiles('scripts/fetch-native.sh', 'scripts/termux_bundle.py') }}

      - name: Bundle QEMU and Docker CLI (jniLibs)
        run: |
          pip install -q patchelf
          scripts/fetch-native.sh

      - name: Build APKs
        run: ./gradlew :app:assembleRelease :app:assembleDebug --no-daemon

      - name: Prepare signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > keystore.jks
            echo "KS_PASS=${{ secrets.KEYSTORE_PASSWORD }}" >> "$GITHUB_ENV"
            echo "KS_ALIAS=${{ secrets.KEY_ALIAS }}" >> "$GITHUB_ENV"
            echo "KEY_PASS=${{ secrets.KEY_PASSWORD }}" >> "$GITHUB_ENV"
            echo "Using release keystore from secrets"
          else
            keytool -genkeypair -keystore keystore.jks -storepass krsdockers -keypass krsdockers -alias krs \
              -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=KRS Dockers, O=KRS Tech Solutions, C=IN"
            echo "KS_PASS=krsdockers" >> "$GITHUB_ENV"
            echo "KS_ALIAS=krs" >> "$GITHUB_ENV"
            echo "KEY_PASS=krsdockers" >> "$GITHUB_ENV"
            echo "::warning::No KEYSTORE_BASE64 secret; signed with a throwaway key (users must uninstall before upgrading)."
          fi

      - name: Sign release APKs
        run: |
          BT="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)"
          # Version comes from (in order): manual input, the pushed v* tag, or the VERSION file.
          VERSION="${{ github.event.inputs.version }}"
          if [ -z "$VERSION" ] && [ "$GITHUB_REF_TYPE" = "tag" ]; then VERSION="${GITHUB_REF_NAME#v}"; fi
          if [ -z "$VERSION" ] && [ -f VERSION ]; then VERSION="$(tr -d '[:space:]' < VERSION)"; fi
          [ -n "$VERSION" ] || VERSION="$(git rev-parse --short HEAD)"
          mkdir -p dist
          for f in app/build/outputs/apk/release/app-*-release-unsigned.apk; do
            abi="$(basename "$f" | sed -E 's/^app-(.*)-release-unsigned\.apk$/\1/')"
            name="krs-dockers-v${VERSION}-${abi}.apk"
            [ "$abi" = "universal" ] && name="krs-dockers-v${VERSION}.apk"
            "$BT/zipalign" -f -p 4 "$f" dist/aligned.apk
            "$BT/apksigner" sign --ks keystore.jks --ks-pass "pass:$KS_PASS" --ks-key-alias "$KS_ALIAS" --key-pass "pass:$KEY_PASS" \
              --out "dist/$name" dist/aligned.apk
            "$BT/apksigner" verify "dist/$name"
            rm dist/aligned.apk
          done
          cp app/build/outputs/apk/debug/app-universal-debug.apk "dist/krs-dockers-v${VERSION}-debug.apk"
          (cd dist && sha256sum *.apk > SHA256SUMS.txt)
          ls -la dist
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: krs-dockers-${{ env.VERSION }}
          path: dist/*
          compression-level: 0

      - name: Publish GitHub release
        # Runs for v* tags, manual dispatch, and pushes that change the VERSION file.
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION }}
          target_commitish: ${{ github.sha }}
          name: KRS Dockers v${{ env.VERSION }}
          body_path: RELEASE_NOTES.md
          files: |
            dist/*.apk
            dist/SHA256SUMS.txt
